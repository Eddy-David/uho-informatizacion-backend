<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    @page { size: A6; margin: 6mm; }
    * { box-sizing: border-box; }
    body {
      font-family: "DejaVu Sans", Arial, sans-serif;
      margin: 0;
      color: #FFFFFF;
      background: linear-gradient(160deg, #0D2240 0%, #14305C 65%, #2C4E86 100%);
      width: 100%;
      height: 100%;
    }
    .card { padding: 6mm 5mm; height: 88mm; display: flex; flex-direction: column; justify-content: space-between; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .uho { font-size: 16pt; font-weight: bold; color: #D9A441; }
    .inst { font-size: 6pt; max-width: 32mm; line-height: 1.2; }
    .photo {
      width: 22mm; height: 26mm; border-radius: 2mm; background: #EAF1FB;
      color: #14305C; display: flex; align-items: center; justify-content: center;
      font-size: 14pt; font-weight: bold; overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 11pt; font-weight: bold; margin-top: 3mm; }
    .meta { font-size: 6.5pt; opacity: .9; line-height: 1.4; }
    .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .level {
      background: #D9A441; color: #0D2240; font-size: 6.5pt; font-weight: bold;
      padding: 1.5mm 3mm; border-radius: 10mm;
    }
    .qr { background: #fff; padding: 1.5mm; border-radius: 1.5mm; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div class="uho">UHO</div>
        <div class="inst">{{ institution_name }}</div>
      </div>
      <div class="photo">{% if initials %}{{ initials }}{% else %}UHO{% endif %}</div>
    </div>
    <div>
      <div class="name">{{ full_name }}</div>
      <div class="meta">
        {{ identity_card }}<br>
        {{ user_type }} · {{ area }}<br>
        Solapín: {{ badge_number }}
      </div>
    </div>
    <div class="bottom">
      <span class="level">{{ access_level }}</span>
      {% if qr_svg %}<div class="qr">{{ qr_svg|safe }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
